<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Moments - 婚禮相片分享</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #fdfaf6;
            -webkit-tap-highlight-color: transparent;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
        }

        /* 針對 iOS 的按鈕優化 */
        .upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        #photo-input {
            position: absolute;
            font-size: 100px;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        /* 輪播動畫 */
        .slide-up {
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%) rotate(5deg); opacity: 0; }
            to { transform: translateY(0) rotate(1deg); opacity: 1; }
        }

        .photo-card {
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 12px solid white;
            border-bottom: 45px solid white;
        }

        .guest-grid-item {
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center overflow-x-hidden">

    <!-- 載入中遮罩 -->
    <div id="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-pink-500 mb-4"></div>
        <p class="text-gray-500">正在準備浪漫空間...</p>
    </div>

    <!-- 賓客上傳模式 (Guest Mode) -->
    <div id="guest-view" class="hidden w-full max-w-md px-6 py-10 flex flex-col items-center">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-serif">Wedding Moments</h1>
            <p class="text-gray-500 italic">分享您眼中的幸福瞬間</p>
        </header>

        <!-- 上傳大按鈕區 -->
        <div class="upload-wrapper mb-10">
            <div class="w-60 h-60 rounded-full gradient-bg shadow-2xl flex flex-col items-center justify-center border-8 border-white transition-transform active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-white mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="text-white text-xl font-bold tracking-widest font-serif">上傳照片</span>
            </div>
            <!-- 將 input 置於最上層並透明，確保 iOS 觸發選單 -->
            <input type="file" id="photo-input" accept="image/jpeg,image/png,image/gif,image/*" title="上傳照片">
        </div>

        <div id="status-msg" class="mb-8 text-sm font-medium text-pink-600 h-6 text-center"></div>

        <!-- 賓客即時牆：回答「大家上傳的要怎麼秀」 -->
        <div class="w-full border-t border-gray-200 pt-8">
            <h2 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-pink-400 rounded-full animate-ping"></span>
                即時祝福牆
            </h2>
            <div id="guest-gallery" class="grid grid-cols-3 gap-2">
                <!-- 照片會動態出現在這裡 -->
            </div>
        </div>
        
        <footer class="mt-12 text-xs text-gray-400 text-center">
            如果您無法選擇相簿，請點擊右上角「...」使用瀏覽器開啟
        </footer>
    </div>

    <!-- 大螢幕播放模式 (Dashboard Mode) -->
    <div id="dashboard-view" class="hidden fixed inset-0 bg-neutral-900 flex items-center justify-center">
        <div id="slideshow-container" class="relative w-full h-full flex items-center justify-center">
            <div id="empty-state" class="text-white text-2xl animate-pulse font-serif">
                等待照片上傳中...
            </div>
        </div>
        <div class="absolute bottom-10 left-10 bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 shadow-2xl flex items-center gap-4">
            <div class="text-left">
                <p class="text-white font-bold text-2xl mb-1">掃碼分享您的照片</p>
                <p class="text-white/60 text-lg italic font-serif">Forever & Always</p>
            </div>
        </div>
    </div>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyBepjw82kk-gC0XzzzswLNDDJTGSjrPK54",
            authDomain: "wedding-moments-9ac34.firebaseapp.com",
            projectId: "wedding-moments-9ac34",
            storageBucket: "wedding-moments-9ac34.firebasestorage.app",
            messagingSenderId: "236760154456",
            appId: "1:236760154456:web:d0428c45c512d0f305a52d",
            measurementId: "G-2TXYY38NH9"
        };

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const weddingId = 'wedding-app'; 

        const urlParams = new URLSearchParams(window.location.search);
        const isDashboard = urlParams.get('mode') === 'dashboard';

        signInAnonymously(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loading').classList.add('hidden');
                if (isDashboard) {
                    showDashboard();
                } else {
                    showGuest();
                }
            }
        });

        // --- 賓客功能 ---
        function showGuest() {
            document.getElementById('guest-view').classList.remove('hidden');
            const input = document.getElementById('photo-input');
            const status = document.getElementById('status-msg');
            const gallery = document.getElementById('guest-gallery');

            // 監聽所有人的照片，顯示在下方牆上
            const q = query(collection(db, 'artifacts', weddingId, 'public', 'data', 'photos'), orderBy('timestamp', 'desc'), limit(12));
            onSnapshot(q, (snapshot) => {
                gallery.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const img = document.createElement('img');
                    img.src = data.imageUrl;
                    img.className = 'guest-grid-item fade-in';
                    gallery.appendChild(img);
                });
            });

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                status.innerText = "❤️ 正在傳送祝福...";
                
                try {
                    const base64 = await resizeAndConvert(file);
                    await addDoc(collection(db, 'artifacts', weddingId, 'public', 'data', 'photos'), {
                        imageUrl: base64,
                        timestamp: Date.now()
                    });
                    status.innerText = "✅ 傳送成功！感謝您的分享";
                    input.value = "";
                    setTimeout(() => status.innerText = "", 3000);
                } catch (err) {
                    status.innerText = "❌ 傳送失敗，請換張照片試試";
                    console.error(err);
                }
            };
        }

        // --- 大螢幕播放功能 ---
        async function showDashboard() {
            document.getElementById('dashboard-view').classList.remove('hidden');
            const container = document.getElementById('slideshow-container');
            const emptyState = document.getElementById('empty-state');
            
            let allPhotos = [];
            let photoQueue = [];
            let isPlaying = false;

            // 監聽新照片與歷史照片
            const q = query(collection(db, 'artifacts', weddingId, 'public', 'data', 'photos'), orderBy('timestamp', 'desc'));
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        photoQueue.push(data.imageUrl);
                        if (!allPhotos.includes(data.imageUrl)) {
                            allPhotos.push(data.imageUrl);
                        }
                        if (!isPlaying && allPhotos.length > 0) startLoop();
                    }
                });
            });

            async function startLoop() {
                if (isPlaying) return;
                isPlaying = true;
                emptyState.classList.add('hidden');

                let historyIndex = 0;
                while (true) {
                    let nextImg = photoQueue.length > 0 ? photoQueue.shift() : allPhotos[historyIndex];
                    if (nextImg) {
                        await displayImage(nextImg);
                        historyIndex = (historyIndex + 1) % allPhotos.length;
                    } else {
                        await new Promise(r => setTimeout(r, 2000));
                    }
                }
            }

            function displayImage(url) {
                return new Promise((resolve) => {
                    const imgFrame = document.createElement('div');
                    imgFrame.className = "absolute inset-0 flex items-center justify-center p-12 slide-up";
                    imgFrame.innerHTML = `
                        <div class="photo-card relative bg-white p-5 transform">
                            <img src="${url}" class="max-w-full max-h-[75vh] object-contain">
                            <div class="mt-10 text-center text-gray-500 font-serif text-4xl tracking-widest italic">
                                Forever & Always
                            </div>
                        </div>
                    `;
                    
                    if (container.children.length > 1) {
                        const old = Array.from(container.children).find(el => el !== emptyState && el !== imgFrame);
                        if (old) {
                            old.style.transition = "all 1.5s ease";
                            old.style.opacity = "0";
                            old.style.transform = "scale(0.8) translateY(-100px)";
                            setTimeout(() => old.remove(), 1500);
                        }
                    }
                    container.appendChild(imgFrame);
                    setTimeout(resolve, 6000);
                });
            }
        }

        function resizeAndConvert(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX = 900;
                        if (width > MAX) { height *= MAX / width; width = MAX; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                };
            });
        }
    </script>
</body>
</html>
