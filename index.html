<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Moments - 婚禮 AI 幻影相館</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #fdfaf6;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
        }

        .ai-gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .soft-shadow {
            box-shadow: 0 10px 30px -5px rgba(251, 194, 235, 0.5), 
                        0 8px 15px -8px rgba(166, 193, 238, 0.4);
        }

        .upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            transition: all 0.3s ease;
            z-index: 50;
        }

        #photo-input, #ai-photo-input {
            position: absolute;
            font-size: 100px;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            z-index: 60;
        }

        /* 星空漂浮動畫 */
        @keyframes float-star {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(15px, -20px) rotate(2deg) scale(1.05); }
            66% { transform: translate(-10px, -10px) rotate(-2deg) scale(0.95); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        .floating-photo {
            position: absolute;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: float-star 8s ease-in-out infinite;
            transition: opacity 1s ease-in-out;
        }

        #guest-gallery-container {
            position: relative;
            width: 100%;
            height: 380px;
            overflow: hidden;
            background: radial-gradient(circle at center, #fffcf9 0%, #fdfaf6 100%);
        }

        /* 大螢幕動畫 */
        .slide-up {
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%) rotate(5deg); opacity: 0; }
            to { transform: translateY(0) rotate(1deg); opacity: 1; }
        }

        .photo-card {
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
            border: 12px solid white;
            border-bottom: 50px solid white;
        }

        /* AI 處理中動畫 */
        .ai-loading-glow {
            animation: ai-glow 2s infinite;
        }
        @keyframes ai-glow {
            0%, 100% { box-shadow: 0 0 10px #764ba2; }
            50% { box-shadow: 0 0 30px #667eea; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- 載入中遮罩 -->
    <div id="loading" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-pink-500 mb-4"></div>
        <p class="text-gray-500">正在進入浪漫空間...</p>
    </div>

    <!-- AI 處理中遮罩 -->
    <div id="ai-processing" class="hidden fixed inset-0 z-[110] flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="w-32 h-32 rounded-full ai-gradient-bg ai-loading-glow flex items-center justify-center mb-6">
            <svg class="animate-spin h-12 w-12 text-white" viewBox="0 0 24 24">
                <path fill="currentColor" d="M12 2A10 10 0 0 0 2 12A10 10 0 0 0 12 22A10 10 0 0 0 22 12A10 10 0 0 0 12 2M12 4A8 8 0 0 1 20 12A8 8 0 0 1 12 20A8 8 0 0 1 4 12A8 8 0 0 1 12 4Z opacity=".3"/>
                <path fill="currentColor" d="M4 12A8 8 0 0 1 12 4V2A10 10 0 0 0 2 12h2Z"/>
            </svg>
        </div>
        <p class="text-white text-xl font-bold font-serif mb-2">AI 魔法融合中...</p>
        <p class="text-white/60">正在讓您與新人合體拍照</p>
    </div>

    <!-- 賓客介面 -->
    <div id="guest-view" class="hidden w-full max-w-md flex flex-col items-center px-6">
        <header class="py-10 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-1 font-serif">Wedding Moments</h1>
            <p class="text-pink-400 font-bold italic">AI 幻影相館</p>
        </header>

        <div class="grid grid-cols-1 gap-6 w-full mb-10">
            <!-- 一般上傳 -->
            <div class="upload-wrapper mx-auto">
                <div class="w-64 h-24 rounded-2xl gradient-bg soft-shadow flex items-center justify-center border-4 border-white">
                    <svg class="h-8 w-8 text-white mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                    <span class="text-white text-lg font-bold font-serif">一般傳送照片</span>
                </div>
                <input type="file" id="photo-input" accept="image/*">
            </div>

            <!-- AI 融合上傳 -->
            <div class="upload-wrapper mx-auto">
                <div class="w-64 h-24 rounded-2xl ai-gradient-bg shadow-xl flex items-center justify-center border-4 border-white/50">
                    <svg class="h-8 w-8 text-white mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    <div class="text-left">
                        <span class="text-white text-lg font-bold font-serif block">AI 幻影合照</span>
                        <span class="text-white/70 text-xs">自拍並與新人合體</span>
                    </div>
                </div>
                <input type="file" id="ai-photo-input" accept="image/*" capture="user">
            </div>
        </div>

        <div id="status-msg" class="mb-4 text-sm font-medium text-pink-600 h-6 text-center"></div>

        <div id="guest-gallery-container" class="rounded-3xl shadow-inner border border-gray-100">
            <div class="absolute top-4 left-6 z-10"><h2 class="text-sm font-bold text-gray-400 font-serif flex items-center gap-2">即時祝福星空</h2></div>
        </div>
        
        <footer class="py-8 text-xs text-gray-300">Powered by Gemini AI Magic</footer>
    </div>

    <!-- 管理員介面 -->
    <div id="admin-view" class="hidden w-full max-w-4xl px-6 py-10">
        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8 border-2 border-pink-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4 font-serif">1. 設定新人基底照 (AI 參考用)</h2>
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div id="couple-base-preview" class="w-48 h-48 bg-gray-50 rounded-xl overflow-hidden border-2 border-dashed border-gray-200 flex items-center justify-center">
                    <span class="text-gray-400 text-sm">尚未設定</span>
                </div>
                <div class="flex-1 space-y-4 text-center md:text-left">
                    <input type="file" id="couple-base-input" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100">
                    <p class="text-xs text-gray-400">請挑選一張橫式且光線充足的婚紗照，AI 融合效果會更好。</p>
                    <button id="confirm-base-btn" class="hidden px-8 py-3 bg-pink-500 text-white rounded-full font-bold shadow-lg hover:bg-pink-600 transition-colors">
                        確認上傳基底照
                    </button>
                </div>
            </div>
        </div>
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-red-600 font-serif">2. 照片管理</h2>
            <p id="photo-count" class="text-gray-500"></p>
        </div>
        <div id="admin-gallery" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </div>

    <!-- 大螢幕播放 -->
    <div id="dashboard-view" class="hidden fixed inset-0 bg-neutral-950 flex items-center justify-center">
        <div id="slideshow-container" class="relative w-full h-full flex items-center justify-center">
            <div id="empty-state" class="text-white/20 text-2xl animate-pulse font-serif">MOMENTS IN THE STARS...</div>
        </div>
        <div class="absolute bottom-10 left-10 bg-black/40 backdrop-blur-xl p-8 rounded-3xl border border-white/10 shadow-2xl">
            <p class="text-white font-bold text-3xl mb-1 font-serif">掃碼分享您的感動</p>
            <p class="text-white/40 text-xl italic font-serif italic">AI 幻影相館即時上映</p>
        </div>
    </div>

    <script type="module">
        const apiKey = ""; // 由環境提供
        const firebaseConfig = {
            apiKey: "AIzaSyBepjw82kk-gC0XzzzswLNDDJTGSjrPK54",
            authDomain: "wedding-moments-9ac34.firebaseapp.com",
            projectId: "wedding-moments-9ac34",
            storageBucket: "wedding-moments-9ac34.firebasestorage.app",
            messagingSenderId: "236760154456",
            appId: "1:236760154456:web:d0428c45c512d0f305a52d",
            measurementId: "G-2TXYY38NH9"
        };

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, doc, deleteDoc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const weddingId = 'wedding-app'; 

        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');

        signInAnonymously(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loading').classList.add('hidden');
                if (mode === 'admin') showAdmin();
                else if (mode === 'dashboard') showDashboard();
                else showGuest();
            }
        });

        // --- AI 融合核心邏輯 ---
        async function runAIMagic(guestBase64) {
            const baseSnap = await getDoc(doc(db, 'artifacts', weddingId, 'settings', 'couplePhoto'));
            if (!baseSnap.exists()) {
                throw new Error("管理員還沒上傳新人的基底照喔！");
            }
            const coupleBase64 = baseSnap.data().imageUrl;

            const prompt = "This is a wedding photo of a couple (Image 1) and a selfie of a guest (Image 2). Please generate a NEW photo that seamlessly blends the guest from Image 2 into the wedding scene of Image 1. The guest should appear as if they are standing next to the couple as a friend, maintaining their facial features and the wedding's lighting and atmosphere. Ensure the result looks like a natural group photo.";

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inlineData: { mimeType: "image/jpeg", data: coupleBase64.split(',')[1] } },
                            { inlineData: { mimeType: "image/jpeg", data: guestBase64.split(',')[1] } }
                        ]
                    }],
                    generationConfig: { responseModalities: ['IMAGE'] }
                })
            });

            const result = await response.json();
            const generatedBase64 = result.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
            
            if (!generatedBase64) throw new Error("AI 魔法失敗了，請重試！");
            return `data:image/png;base64,${generatedBase64}`;
        }

        // --- 賓客功能 ---
        function showGuest() {
            document.getElementById('guest-view').classList.remove('hidden');
            const normalInput = document.getElementById('photo-input');
            const aiInput = document.getElementById('ai-photo-input');
            const status = document.getElementById('status-msg');
            const container = document.getElementById('guest-gallery-container');

            onSnapshot(query(collection(db, 'artifacts', weddingId, 'public', 'data', 'photos'), orderBy('timestamp', 'desc'), limit(15)), (snapshot) => {
                const currentIds = Array.from(container.querySelectorAll('img')).map(img => img.dataset.id);
                snapshot.docs.forEach(docSnap => {
                    if (!currentIds.includes(docSnap.id)) {
                        const data = docSnap.data();
                        const img = document.createElement('img');
                        img.src = data.imageUrl;
                        img.dataset.id = docSnap.id;
                        img.className = 'floating-photo';
                        const size = Math.floor(Math.random() * 50) + 70;
                        img.style.width = `${size}px`; img.style.height = `${size}px`;
                        img.style.left = `${Math.random() * 75 + 5}%`; img.style.top = `${Math.random() * 70 + 10}%`;
                        img.style.animationDuration = `${Math.random() * 4 + 6}s`;
                        img.style.opacity = '0';
                        container.appendChild(img);
                        setTimeout(() => img.style.opacity = '1', 100);
                    }
                });
            });

            normalInput.onchange = async (e) => handleUpload(e.target.files[0], false);
            aiInput.onchange = async (e) => handleUpload(e.target.files[0], true);

            async function handleUpload(file, isAI) {
                if (!file) return;
                if (isAI) document.getElementById('ai-processing').classList.remove('hidden');
                status.innerText = isAI ? "✨ AI 正在施放魔法..." : "💖 正在傳送祝福...";
                
                try {
                    let finalImage = await resizeAndConvert(file);
                    if (isAI) {
                        finalImage = await runAIMagic(finalImage);
                    }
                    await addDoc(collection(db, 'artifacts', weddingId, 'public', 'data', 'photos'), {
                        imageUrl: finalImage,
                        timestamp: Date.now(),
                        type: isAI ? 'ai' : 'normal'
                    });
                    status.innerText = "成功！去大螢幕找找看吧 ❤️";
                } catch (err) {
                    status.innerText = err.message || "傳送失敗，請重試";
                    console.error(err);
                } finally {
                    document.getElementById('ai-processing').classList.add('hidden');
                    normalInput.value = aiInput.value = "";
                    setTimeout(() => status.innerText = "", 4000);
                }
            }
        }

        // --- 管理員功能 ---
        function showAdmin() {
            document.getElementById('admin-view').classList.remove('hidden');
            const baseInput = document.getElementById('couple-base-input');
            const basePreview = document.getElementById('couple-base-preview');
            const confirmBtn = document.getElementById('confirm-base-btn');
            const gallery = document.getElementById('admin-gallery');
            let pendingBase64 = null;

            // 1. 初始化讀取目前的基底照
            getDoc(doc(db, 'artifacts', weddingId, 'settings', 'couplePhoto')).then(snap => {
                if (snap.exists()) {
                    basePreview.innerHTML = `<img src="${snap.data().imageUrl}" class="w-full h-full object-cover">`;
                }
            });

            // 2. 當選擇檔案時，先做本地預覽
            baseInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                pendingBase64 = await resizeAndConvert(file);
                basePreview.innerHTML = `<img src="${pendingBase64}" class="w-full h-full object-cover opacity-60">`;
                confirmBtn.classList.remove('hidden'); // 顯示確認按鈕
                confirmBtn.innerText = "確認上傳基底照";
                confirmBtn.disabled = false;
            };

            // 3. 點擊確認按鈕才執行 Firebase 儲存
            confirmBtn.onclick = async () => {
                if (!pendingBase64) return;
                
                confirmBtn.innerText = "上傳中...";
                confirmBtn.disabled = true;

                try {
                    await setDoc(doc(db, 'artifacts', weddingId, 'settings', 'couplePhoto'), { 
                        imageUrl: pendingBase64,
                        updatedAt: Date.now()
                    });
                    basePreview.querySelector('img').classList.remove('opacity-60');
                    alert("基底照更新成功！");
                    confirmBtn.classList.add('hidden');
                } catch (err) {
                    alert("上傳失敗，請檢查網路設定。");
                    confirmBtn.disabled = false;
                    confirmBtn.innerText = "再試一次";
                }
            };

            const q = query(collection(db, 'artifacts', weddingId, 'public', 'data', 'photos'), orderBy('timestamp', 'desc'));
            onSnapshot(q, (snapshot) => {
                gallery.innerHTML = '';
                document.getElementById('photo-count').innerText = `目前共有 ${snapshot.size} 張照片`;
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const div = document.createElement('div');
                    div.className = 'relative group';
                    div.innerHTML = `
                        <img src="${data.imageUrl}" class="w-full h-32 object-cover rounded-lg border ${data.type==='ai'?'border-purple-500 border-2':''}">
                        ${data.type==='ai'?'<span class="absolute top-1 left-1 bg-purple-600 text-[8px] text-white px-1 rounded">AI</span>':''}
                        <button class="absolute top-1 right-1 bg-red-500 text-white text-[10px] px-2 py-1 rounded shadow opacity-0 group-hover:opacity-100 transition-opacity" onclick="window.deletePhoto('${docSnap.id}')">刪除</button>
                    `;
                    gallery.appendChild(div);
                });
            });
            window.deletePhoto = async (id) => { if(confirm('確定刪除？')) await deleteDoc(doc(db, 'artifacts', weddingId, 'public', 'data', 'photos', id)); };
        }

        // --- 大螢幕播放 ---
        async function showDashboard() {
            document.getElementById('dashboard-view').classList.remove('hidden');
            const container = document.getElementById('slideshow-container');
            const emptyState = document.getElementById('empty-state');
            let allPhotos = [];
            let photoQueue = [];
            let isPlaying = false;

            onSnapshot(query(collection(db, 'artifacts', weddingId, 'public', 'data', 'photos'), orderBy('timestamp', 'desc')), (snapshot) => {
                allPhotos = snapshot.docs.map(d => ({ url: d.data().imageUrl, type: d.data().type }));
                snapshot.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        if (!photoQueue.find(p => p.url === data.imageUrl)) photoQueue.push({ url: data.imageUrl, type: data.type });
                        if (!isPlaying && allPhotos.length > 0) startLoop();
                    }
                });
            });

            async function startLoop() {
                if (isPlaying) return;
                isPlaying = true;
                emptyState.classList.add('hidden');
                let idx = 0;
                while (true) {
                    let next = photoQueue.length > 0 ? photoQueue.shift() : allPhotos[idx];
                    if (next && allPhotos.find(p => p.url === next.url)) {
                        await displayImage(next);
                        idx = (idx + 1) % allPhotos.length;
                    } else if (allPhotos.length > 0) {
                        idx = (idx + 1) % allPhotos.length;
                        await new Promise(r => setTimeout(r, 100));
                    } else {
                        emptyState.classList.remove('hidden');
                        isPlaying = false; break;
                    }
                }
            }

            function displayImage(photo) {
                return new Promise((resolve) => {
                    const frame = document.createElement('div');
                    frame.className = "absolute inset-0 flex items-center justify-center p-12 slide-up";
                    const isAI = photo.type === 'ai';
                    frame.innerHTML = `
                        <div class="photo-card bg-white p-5 transform relative">
                            ${isAI ? '<div class="absolute -top-6 -right-6 bg-purple-600 text-white text-xl px-4 py-2 rounded-full shadow-lg font-bold">AI 魔法照片</div>' : ''}
                            <img src="${photo.url}" class="max-w-full max-h-[75vh] object-contain">
                            <div class="mt-10 text-center text-gray-400 font-serif text-4xl italic">${isAI ? 'Magical Moment' : 'Forever Love'}</div>
                        </div>
                    `;
                    if (container.children.length > 1) {
                        const old = container.children[0] === emptyState ? null : container.children[0];
                        if (old) {
                            old.style.transition = "all 1.5s ease";
                            old.style.opacity = "0";
                            old.style.transform = "scale(0.8) translateY(-100px)";
                            setTimeout(() => old.remove(), 1500);
                        }
                    }
                    container.appendChild(frame);
                    setTimeout(resolve, 6000);
                });
            }
        }

        function resizeAndConvert(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > 800) { h *= 800 / w; w = 800; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                };
            });
        }
    </script>
</body>
</html>
